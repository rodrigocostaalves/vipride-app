<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VipRide — Painel da Empresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0D1730;
      --navy2: #152342;
      --navy3: #1E3055;
      --line: #2A3E67;
      --gold: #E3B23C;
      --gold2: #F5D07E;
      --sky: #8FA9D4;
      --paper: #F3F6FB;
      --success: #25D366;
      --danger: #ff6b6b;
      --warning: #f1c40f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter Tight', system-ui, sans-serif;
      background: #070C18;
      color: var(--paper);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    button { cursor: pointer; border: 0; background: none; font: inherit; color: inherit; }
    a { text-decoration: none; color: inherit; }

    .app-dash {
      width: 100%;
      max-width: 900px;
      background: var(--navy);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      border: 1px solid var(--line);
      min-height: 600px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      color: var(--gold);
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 small {
      font-family: 'Inter Tight', sans-serif;
      font-weight: 400;
      color: var(--sky);
      font-size: 14px;
    }
    .header .status-badge {
      background: var(--success);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header .status-badge span { font-size: 14px; }

    .filtros {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filtros input, .filtros select {
      background: var(--navy2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--paper);
      font-size: 14px;
      flex: 1;
      min-width: 150px;
      outline: none;
    }
    .filtros input:focus, .filtros select:focus {
      border-color: var(--gold);
    }
    .filtros input::placeholder { color: var(--sky); }

    .lista-solicitacoes {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-solicitacao {
      background: var(--navy2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr 1fr auto;
      gap: 12px;
      align-items: center;
      transition: 0.2s;
      cursor: pointer;
    }
    .card-solicitacao:hover {
      border-color: var(--gold);
      background: rgba(227, 178, 60, 0.05);
      transform: translateY(-2px);
    }
    .card-solicitacao .codigo {
      font-weight: 700;
      color: var(--gold);
      font-size: 14px;
    }
    .card-solicitacao .cliente {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      flex-direction: column;
    }
    .card-solicitacao .cliente small {
      font-weight: 400;
      color: var(--sky);
      font-size: 12px;
    }
    .card-solicitacao .servico {
      font-size: 14px;
      color: var(--paper);
    }
    .card-solicitacao .servico small {
      display: block;
      color: var(--sky);
      font-size: 12px;
    }
    .card-solicitacao .valor {
      font-weight: 700;
      color: var(--gold);
      font-size: 16px;
    }
    .card-solicitacao .status {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      text-align: center;
      white-space: nowrap;
    }
    .status.novo { background: rgba(241, 196, 15, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status.confirmado { background: rgba(37, 211, 102, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status.cancelado { background: rgba(255, 107, 107, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .card-solicitacao .arrow {
      color: var(--sky);
      font-size: 18px;
    }

    #detalhesArea {
      display: none;
      background: var(--navy2);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 24px;
      margin-top: 20px;
    }
    #detalhesArea.ativo { display: block; }

    .voltar-lista {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--sky);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      transition: 0.2s;
    }
    .voltar-lista:hover { color: var(--gold); }

    .detalhes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 30px;
    }
    .detalhes-item {
      border-bottom: 1px solid var(--line);
      padding: 8px 0;
    }
    .detalhes-item label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--sky);
      font-weight: 600;
    }
    .detalhes-item span {
      font-size: 15px;
      font-weight: 500;
      margin-top: 2px;
      display: block;
    }
    .detalhes-item .highlight { color: var(--gold); font-weight: 700; }

    .acoes-detalhe {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn-acao {
      background: var(--gold);
      color: #20180A;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      transition: 0.2s;
      flex: 1;
      min-width: 140px;
      text-align: center;
    }
    .btn-acao:hover { transform: scale(1.02); box-shadow: 0 4px 20px rgba(227,178,60,0.25); }
    .btn-acao.whats {
      background: var(--success);
      color: #fff;
    }
    .btn-acao.whats:hover { box-shadow: 0 4px 20px rgba(37,211,102,0.25); }
    .btn-acao.secundario {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--paper);
    }
    .btn-acao.secundario:hover { background: var(--navy3); }
    .btn-acao.danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
    }
    .btn-acao.danger:hover { background: var(--danger); color: #fff; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .app-dash { padding: 16px; border-radius: 16px; }
      .header h1 { font-size: 20px; }
      .card-solicitacao {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        padding: 14px;
      }
      .card-solicitacao .codigo { grid-column: 1 / 2; }
      .card-solicitacao .status { grid-column: 2 / 3; text-align: right; }
      .card-solicitacao .cliente { grid-column: 1 / 3; }
      .card-solicitacao .servico { grid-column: 1 / 2; }
      .card-solicitacao .valor { grid-column: 2 / 3; text-align: right; }
      .card-solicitacao .arrow { display: none; }
      .detalhes-grid { grid-template-columns: 1fr; }
      .acoes-detalhe { flex-direction: column; }
    }

    /* ===== TELA DE ACESSO ===== */
    #telaAcesso { position: fixed; inset: 0; background: var(--navy); display: grid; place-items: center; z-index: 100; padding: 20px; }
    #telaAcesso.escondido { display: none; }
    .caixa-acesso { background: var(--navy2); border: 1px solid var(--line); border-radius: 20px; padding: 30px 24px; width: 100%; max-width: 340px; text-align: center; }
    .caixa-acesso h2 { color: var(--gold); font-size: 24px; margin-bottom: 4px; }
    .caixa-acesso p { color: var(--sky); font-size: 13px; margin-bottom: 22px; }
    .caixa-acesso input { width: 100%; background: var(--navy); border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; color: var(--paper); font-size: 16px; outline: none; font-family: inherit; }
    .caixa-acesso input:focus { border-color: var(--gold); }
    .caixa-acesso button { width: 100%; margin-top: 12px; background: var(--gold); color: #20180A; border: none; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 15px; cursor: pointer; font-family: inherit; }
    .caixa-acesso small { display: block; margin-top: 12px; color: var(--danger); font-size: 12.5px; min-height: 16px; }
  </style>
</head>
<body>

<div id="telaAcesso">
  <div class="caixa-acesso">
    <h2>✦ VipRide</h2>
    <p>Painel da empresa</p>
    <input type="password" id="inputToken" placeholder="Token de acesso" autocomplete="current-password">
    <button id="btnEntrar">Entrar</button>
    <small id="erroAcesso"></small>
  </div>
</div>

<div class="app-dash" id="areaPainel" style="display:none;">
  <div class="header">
    <h1>✦ VipRide <small>Painel da Empresa</small></h1>
    <div class="status-badge">
      <span>🟢</span> Online
    </div>
  </div>

  <div class="filtros">
    <input type="text" id="busca" placeholder="Buscar por nome, código ou telefone...">
    <select id="filtroStatus">
      <option value="todos">Todos os status</option>
      <option value="novo">🟡 Novo</option>
      <option value="confirmado">🟢 Confirmado</option>
      <option value="cancelado">🔴 Cancelado</option>
    </select>
  </div>

  <div id="listaArea">
    <div class="lista-solicitacoes" id="listaContainer">
    </div>
  </div>

  <div id="detalhesArea">
    <div class="voltar-lista" id="btnVoltar">
      <span>←</span> Voltar para lista
    </div>
    <h2 style="color: var(--gold); font-family: 'Fraunces'; font-size: 22px; margin-bottom: 16px;" id="detalhesTitulo">Detalhes da Solicitação</h2>
    
    <div class="detalhes-grid" id="detalhesGrid">
    </div>

    <div class="acoes-detalhe">
      <button class="btn-acao secundario" id="btnWhatsApp">💬 Contato via WhatsApp</button>
      <button class="btn-acao" id="btnConfirmar">✅ Marcar como confirmado</button>
      <button class="btn-acao danger" id="btnCancelar">❌ Cancelar reserva</button>
    </div>
  </div>
</div>

<script>
  // ===== CONFIGURAÇÃO CLOUDFLARE (ATUALIZADA) =====
  const API_URL = 'https://vipride-app.rodrigo-costaalves.workers.dev/reservas';

  // Escapa qualquer texto vindo do banco antes de jogar no HTML.
  // Sem isso, um cliente poderia cadastrar um nome com <script> e executá-lo aqui.
  function esc(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function getToken() { return sessionStorage.getItem('vipride_admin') || ''; }

  let dados = [];
  let timerAtualizacao = null;
  let reservaSelecionadaId = null;

  const listaContainer = document.getElementById('listaContainer');
  const detalhesArea = document.getElementById('detalhesArea');
  const listaArea = document.getElementById('listaArea');
  const btnVoltar = document.getElementById('btnVoltar');
  const detalhesGrid = document.getElementById('detalhesGrid');
  const btnWhatsApp = document.getElementById('btnWhatsApp');
  const btnConfirmar = document.getElementById('btnConfirmar');
  const btnCancelar = document.getElementById('btnCancelar');
  const inputBusca = document.getElementById('busca');
  const filtroStatus = document.getElementById('filtroStatus');

  async function carregarReservas() {
    try {
      const response = await fetch(API_URL, { headers: { 'X-Admin-Token': getToken() } });
      if (response.status === 401) { bloquearAcesso('Token inválido ou expirado.'); return; }
      if (!response.ok) throw new Error('Erro ao carregar dados');
      dados = await response.json();
      renderizarLista();
    } catch (error) {
      console.error('Erro:', error);
      listaContainer.innerHTML = `
        <div style="text-align:center; padding:40px; color:var(--danger);">
          <span style="font-size:40px; display:block; margin-bottom:10px;">⚠️</span>
          Erro ao conectar com o banco de dados.<br>
          <small style="color:var(--sky);">${esc(error.message)}</small>
        </div>
      `;
    }
  }

  function renderizarLista() {
    const termo = inputBusca.value.toLowerCase();
    const statusFiltro = filtroStatus.value;

    const filtrados = dados.filter(r => {
      const matchBusca = String(r.codigo || '').toLowerCase().includes(termo) ||
                         String(r.cliente || '').toLowerCase().includes(termo) ||
                         String(r.telefone || '').includes(termo);
      const matchStatus = statusFiltro === 'todos' || r.status === statusFiltro;
      return matchBusca && matchStatus;
    });

    if (filtrados.length === 0) {
      listaContainer.innerHTML = `
        <div style="text-align:center; padding:40px; color:var(--sky);">
          <span style="font-size:40px; display:block; margin-bottom:10px;">📭</span>
          Nenhuma solicitação encontrada.
        </div>
      `;
      return;
    }

    listaContainer.innerHTML = filtrados.map(r => `
      <div class="card-solicitacao" data-id="${esc(r.id)}">
        <span class="codigo">${esc(r.codigo)}</span>
        <div class="cliente">
          ${esc(r.cliente)}
          <small>${esc(r.telefone)}</small>
        </div>
        <div class="servico">
          ${esc(r.servico)}
          <small>${esc(r.veiculo)}</small>
        </div>
        <span class="valor">${esc(r.valor)}</span>
        <span class="status ${esc(r.status)}">${r.status === 'novo' ? '🟡 Novo' : r.status === 'confirmado' ? '🟢 Confirmado' : '🔴 Cancelado'}</span>
        <span class="arrow">›</span>
      </div>
    `).join('');

    document.querySelectorAll('.card-solicitacao').forEach(card => {
      card.addEventListener('click', function() {
        const id = this.dataset.id;
        abrirDetalhes(id);
      });
    });
  }

  function abrirDetalhes(id) {
    const reserva = dados.find(r => r.id == id);
    if (!reserva) return;

    reservaSelecionadaId = id;
    listaArea.style.display = 'none';
    detalhesArea.classList.add('ativo');

    const statusLabel = reserva.status === 'novo' ? '🟡 Novo' : reserva.status === 'confirmado' ? '🟢 Confirmado' : '🔴 Cancelado';

    detalhesGrid.innerHTML = `
      <div class="detalhes-item"><label>Código</label><span class="highlight">${esc(reserva.codigo)}</span></div>
      <div class="detalhes-item"><label>Status</label><span>${statusLabel}</span></div>
      <div class="detalhes-item"><label>Cliente</label><span>${esc(reserva.cliente)}</span></div>
      <div class="detalhes-item"><label>E-mail</label><span>${esc(reserva.email)}</span></div>
      <div class="detalhes-item"><label>Telefone</label><span>${esc(reserva.telefone)}</span></div>
      <div class="detalhes-item"><label>País</label><span>${esc(reserva.pais) || 'Não informado'}</span></div>
      <div class="detalhes-item"><label>Serviço</label><span>${esc(reserva.servico)}</span></div>
      <div class="detalhes-item"><label>Veículo</label><span>${esc(reserva.veiculo)}</span></div>
      <div class="detalhes-item"><label>Data do serviço</label><span>${esc(reserva.data_servico)}</span></div>
      <div class="detalhes-item"><label>Período / Duração</label><span>${esc(reserva.periodo)}</span></div>
      <div class="detalhes-item"><label>Origem</label><span>${esc(reserva.origem) || '—'}</span></div>
      <div class="detalhes-item"><label>Destino</label><span>${esc(reserva.destino) || '—'}</span></div>
      <div class="detalhes-item"><label>Valor total</label><span class="highlight">${esc(reserva.valor)}</span></div>
      <div class="detalhes-item"><label>Voo</label><span>${esc(reserva.voo) || 'Nenhum'}</span></div>
    `;

    if (reserva.status === 'cancelado') {
      btnConfirmar.style.display = 'none';
      btnCancelar.style.display = 'none';
    } else if (reserva.status === 'confirmado') {
      btnConfirmar.style.display = 'none';
      btnCancelar.style.display = 'block';
      btnCancelar.textContent = '❌ Cancelar reserva';
    } else {
      btnConfirmar.style.display = 'block';
      btnCancelar.style.display = 'block';
      btnCancelar.textContent = '❌ Cancelar reserva';
    }
  }

  function voltarParaLista() {
    listaArea.style.display = 'block';
    detalhesArea.classList.remove('ativo');
    reservaSelecionadaId = null;
    carregarReservas();
  }

  async function atualizarStatus(id, novoStatus) {
    try {
      const response = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'X-Admin-Token': getToken() },
        body: JSON.stringify({ status: novoStatus })
      });
      if (response.status === 401) { bloquearAcesso('Token inválido ou expirado.'); return; }
      if (!response.ok) throw new Error('Erro ao atualizar');
      const result = await response.json();
      if (result.success) {
        await carregarReservas();
        abrirDetalhes(id);
      } else {
        alert('Erro ao atualizar status.');
      }
    } catch (error) {
      alert('Erro: ' + error.message);
    }
  }

  btnVoltar.addEventListener('click', voltarParaLista);

  btnWhatsApp.addEventListener('click', function() {
    if (!reservaSelecionadaId) return;
    const reserva = dados.find(r => r.id == reservaSelecionadaId);
    if (!reserva) return;
    const url = `https://wa.me/${reserva.telefone.replace(/[^0-9]/g, '')}`;
    window.open(url, '_blank');
  });

  btnConfirmar.addEventListener('click', function() {
    if (!reservaSelecionadaId) return;
    atualizarStatus(reservaSelecionadaId, 'confirmado');
  });

  btnCancelar.addEventListener('click', function() {
    if (!reservaSelecionadaId) return;
    if (!confirm('Tem certeza que deseja cancelar esta reserva?')) return;
    atualizarStatus(reservaSelecionadaId, 'cancelado');
  });

  inputBusca.addEventListener('input', renderizarLista);
  filtroStatus.addEventListener('change', renderizarLista);

  // ===== CONTROLE DE ACESSO =====
  const telaAcesso = document.getElementById('telaAcesso');
  const areaPainel = document.getElementById('areaPainel');
  const inputToken = document.getElementById('inputToken');
  const erroAcesso = document.getElementById('erroAcesso');

  function bloquearAcesso(mensagem) {
    sessionStorage.removeItem('vipride_admin');
    if (timerAtualizacao) { clearInterval(timerAtualizacao); timerAtualizacao = null; }
    areaPainel.style.display = 'none';
    telaAcesso.classList.remove('escondido');
    erroAcesso.textContent = mensagem || '';
    inputToken.value = '';
  }

  function liberarPainel() {
    telaAcesso.classList.add('escondido');
    areaPainel.style.display = 'block';
    erroAcesso.textContent = '';
    carregarReservas();
    if (!timerAtualizacao) timerAtualizacao = setInterval(carregarReservas, 30000);
  }

  document.getElementById('btnEntrar').addEventListener('click', () => {
    const t = inputToken.value.trim();
    if (!t) { erroAcesso.textContent = 'Digite o token.'; return; }
    sessionStorage.setItem('vipride_admin', t);
    liberarPainel();
  });

  inputToken.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btnEntrar').click(); });

  if (getToken()) liberarPainel();
</script>
</body>
</html>
